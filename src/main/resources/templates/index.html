<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Lab16 - Contact</title>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <link th:href="@{/main.css}" rel="stylesheet" />
</head>
<body class="bg-gray-100 min-h-screen">

  <div class="max-w-2xl mx-auto mt-10 bg-white rounded-xl shadow p-8">
    <h1 class="text-3xl font-bold text-center mb-6">Contact Me</h1>

    <form class="px-2 pb-4"
          th:action="@{/results}"
          method="post"
          th:object="${contactForm}">

      <div class="flex items-center border-b-2 border-gray-300 py-6">
        <input class="appearance-none bg-transparent border-none w-full placeholder-gray-500 mr-3 py-1 leading-tight text-xl focus:outline-none"
               type="text" placeholder="Name" th:field="*{name}">
      </div>

      <div class="flex items-center border-b-2 border-gray-300 py-6">
        <input class="appearance-none bg-transparent border-none w-full placeholder-gray-500 mr-3 py-1 leading-tight text-xl focus:outline-none"
               type="text" placeholder="Email Address" th:field="*{email}">
      </div>

      <div class="flex items-center border-b-2 border-gray-300 py-6">
        <input class="appearance-none bg-transparent border-none w-full placeholder-gray-500 mr-3 py-1 leading-tight text-xl focus:outline-none"
               type="text" placeholder="Phone Number" th:field="*{phone}">
      </div>

      <div class="border-b-2 border-gray-300 py-6">
        <textarea class="appearance-none w-full placeholder-gray-500 py-1 leading-tight text-xl focus:outline-none"
                  rows="5" placeholder="Message" th:field="*{message}"></textarea>
      </div>

      <div class="pt-6">
        <button type="submit" class="bg-green-500 px-8 py-4 rounded-lg text-white text-lg w-full hover:bg-green-600">
          Send
        </button>
      </div>

    </form>
  </div>

</body>
</html>
